site_name: 老闫玩儿技术
site_url: https://yanzhg.github.io/netyourlife/
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗黑模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换明亮模式
  features:
    - navigation.expand
    - search.suggest
    - search.highlight
    - navigation.side

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python

# 强制启用自动目录，兼容所有文档结构，解决目录不显示核心问题
nav:
  - 首页: index.md
  - 技术文档:
      - 自动识别所有文档: index.md
site_name: 老闫玩儿技术
site_url: https://yanzhg.github.io/netyourlife/
base: /netyourlife/

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 暗黑模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 明亮模式
  features:
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

# 👇 👇 👇 这是你完整的左侧目录（我已经按你的文档全部写好）

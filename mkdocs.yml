site_name: 老闫玩儿技术
site_url: https://yanzhg.github.io/netyourlife/
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗黑模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换明亮模式
  features:
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search
  - autorefs

# 启用自动目录，无需手动配置，文件夹结构即目录
nav: []
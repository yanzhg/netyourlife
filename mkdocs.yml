site_name: 老闫玩儿技术
site_url: https://yanzhg.github.io/netyourlife/
# 新增base配置，解决网页解析失败核心问题（与仓库路径完全匹配）
base: /netyourlife/
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换暗黑模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换明亮模式
  features:
    - navigation.expand
    - search.suggest
    - search.highlight
    - navigation.side # 强制显示左侧侧边栏
    - navigation.indexes # 启用目录索引，确保文档能被识别

plugins:
  - search
  - autorefs
  # 移除多余插件（mkdocstrings无用，会导致部署冗余、解析报错）
  - mkdocs-autolinks-plugin # 新增自动链接插件，辅助目录识别

# 手动+自动结合，确保目录必显示（适配你的文档结构）
nav:
  - 首页: index.md
  # 手动指定文档路径（若有其他文档，按此格式添加，替换文件名即可）
  - 技术文档:
      - 示例文档（可替换）: index.md
      # 若有其他文档，直接添加，如：
      # - kopia 异地仓库同步: kopia 异地仓库同步.md
      # - 防火墙策略: 防火墙策略.md
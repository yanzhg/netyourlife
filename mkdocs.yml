site_name: 老闫玩儿技术
site_url: https://yanzhg.github.io/netyourlife/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  sidebar_width: 25rem

plugins:
  - search:
      lang: zh
      separator: '[\s\-\.，。、]'

nav: []

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yanzhg

extra_css:
  - assets/style.css

# ========== 以下是已合并的【公式支持】配置 ==========
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax-config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js